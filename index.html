        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pe-master-app';

        // Hardcoded user config with local override support
        const DEFAULT_FIREBASE_CONFIG = {
            apiKey: "AIzaSyC0SQ1XLO4dOz1XDsRoHPj3MlogPcWr0Iw",
            authDomain: "pe-master-3706c.firebaseapp.com",
            projectId: "pe-master-3706c",
            storageBucket: "pe-master-3706c.firebasestorage.app",
            messagingSenderId: "418088724195",
            appId: "1:418088724195:web:10981eaa98d6e73ae407d6"
        };

        let firebaseConfig = DEFAULT_FIREBASE_CONFIG;
        const savedCustom = localStorage.getItem('PE_FIREBASE_CONFIG');
        if (savedCustom) {
            try { firebaseConfig = JSON.parse(savedCustom); } catch(e) { console.error(e); }
        }

        window.PE_CLOUD = {
            isAvailable: false,
            syncCode: localStorage.getItem('PE_SYNC_CODE') || 'MAIN',
            user: null,
            db: null,
            unsubscribe: null,
            
            init: async function(onRemoteDataReceived, onStatusChanged) {
                try {
                    const app = initializeApp(firebaseConfig);
                    const auth = getAuth(app);
                    const firestore = getFirestore(app);
                    this.db = firestore;

                    onStatusChanged('CONNECTING', '클라우드 연동 접속 중...');

                    let userCredential;
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            userCredential = await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            userCredential = await signInAnonymously(auth);
                        }
                    } catch (tokenErr) {
                        console.warn("Custom token authentication failed or mismatched. Falling back to anonymous login:", tokenErr);
                        userCredential = await signInAnonymously(auth);
                    }
                    this.user = userCredential.user;
                    this.isAvailable = true;

                    this.subscribeToSyncCode(this.syncCode, onRemoteDataReceived, onStatusChanged);
                } catch(err) {
                    console.error("Cloud init error:", err);
                    onStatusChanged('ERROR', '클라우드 연결 오류 (' + err.message + ')');
                }
            },

            subscribeToSyncCode: function(code, onRemoteDataReceived, onStatusChanged) {
                if (!this.db || !this.user) return;
                if (this.unsubscribe) this.unsubscribe();

                this.syncCode = code || 'MAIN';
                localStorage.setItem('PE_SYNC_CODE', this.syncCode);

                const docRef = doc(this.db, 'artifacts', appId, 'public', 'data', 'pe_master_rooms', `sync_${this.syncCode}`);
                onStatusChanged('CONNECTING', `동기화 코드 [${this.syncCode}] 연결 중...`);

                this.unsubscribe = onSnapshot(docRef, (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        if (data && data.db) {
                            onRemoteDataReceived(data.db);
                            onStatusChanged('CONNECTED', `실시간 클라우드 동기화 중 [코드: ${this.syncCode}]`);
                        }
                    } else {
                        onStatusChanged('CONNECTED', `동기화 코드 [${this.syncCode}] 신규 생성됨`);
                    }
                }, (error) => {
                    console.error("Firestore onSnapshot error:", error);
                    onStatusChanged('ERROR', '클라우드 동기화 수신 오류');
                });
            },

            saveToCloud: async function(data) {
                if (!this.isAvailable || !this.db || !this.user) return;
                try {
                    const docRef = doc(this.db, 'artifacts', appId, 'public', 'data', 'pe_master_rooms', `sync_${this.syncCode}`);
                    await setDoc(docRef, {
                        db: data,
                        lastUpdated: new Date().toISOString(),
                        updatedBy: this.user.uid
                    }, { merge: true });
                } catch(e) {
                    console.error("Cloud save failed:", e);
                }
            }
        };
    </script>

                        ...prev.classProgressCursors,
                        [classId]: lessonNumber
                    };

                    const updatedRecords = { ...prev.lessonRecords };
                    Object.keys(updatedRecords).forEach(key => {
                        if (key.startsWith(`${classId}_`)) {
                            const lNum = parseInt(key.replace(`${classId}_`, ''), 10);

        function TodayClassCard({ cls, lesson, record, totalLessons, equipmentDb, db, currentCurriculum, onComplete, onOpenPresentation, onSaveMemo }) {
            const [memo, setMemo] = React.useState(record.memo || '');
            const [nextMemo, setNextMemo] = React.useState(record.nextMemo || '');
            const [isEditingMemo, setIsEditingMemo] = React.useState(false);
            const [showHistory, setShowHistory] = React.useState(false);

            React.useEffect(() => {
                setMemo(record.memo || '');
                setNextMemo(record.nextMemo || '');
            }, [record]);

            const materialsList = (lesson.materials || '').split(',').map(m => m.trim()).filter(Boolean);
            const warnings = materialsList.map(mat => {
                const found = equipmentDb.find(e => mat.includes(e.name) || e.name.includes(mat));
                if (found && found.quantity < 10) {
                    return `${found.name} 보유 부족 (${found.quantity}개)`;
                }
                return null;
            }).filter(Boolean);

            const previousLogs = React.useMemo(() => {
                const prefix = `${cls.id}_`;
                const logs = [];
                Object.keys(db.lessonRecords || {}).forEach(key => {
                    if (key.startsWith(prefix)) {
                        const lNum = parseInt(key.replace(prefix, ''), 10);
                        if (lNum < lesson.lessonNumber) {
                            const rec = db.lessonRecords[key];
                            if (rec && (rec.memo || rec.nextMemo)) {
                                const prevLesson = currentCurriculum?.lessons.find(l => l.lessonNumber === lNum);
                                logs.push({
                                    lessonNumber: lNum,
                                    topic: prevLesson?.topic || `${lNum}차시`,
                                    date: rec.date,
                                    memo: rec.memo,
                                    nextMemo: rec.nextMemo
                                });
                            }
                        }
                    }
                });
                return logs.sort((a, b) => b.lessonNumber - a.lessonNumber);
            }, [db.lessonRecords, cls.id, lesson.lessonNumber, currentCurriculum]);

            return (
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition overflow-hidden flex flex-col justify-between">
                    <div>
                        <div className="bg-slate-50 px-6 py-4 border-b border-slate-100 flex justify-between items-center">

                                <h4 className="text-xl font-bold text-slate-900 group-hover:text-sky-600 transition">

                                <p className="text-sm text-slate-600 mt-1 font-medium leading-relaxed">
                                    {lesson.objective}
                                </p>
                            </div>

                            <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-100 space-y-1.5">
                                <div className="flex items-center gap-2 text-xs font-bold text-slate-500">
                                    <i className="fa-solid fa-box-archive text-sky-500"></i>
                                    <span>필요 준비물:</span>
                                    <span className="text-slate-800 font-semibold">{lesson.materials || '없음'}</span>
                                </div>
                                {warnings.map((w, idx) => (
                                    <div key={idx} className="text-xs font-bold text-amber-600 flex items-center gap-1.5 pt-0.5">
                                        <i className="fa-solid fa-triangle-exclamation"></i>
                                        <span>⚠️ {w}</span>
                                    </div>
                                ))}
                            </div>

                            <div className="space-y-2 pt-1">
                                {!isEditingMemo ? (
                                    <div className="text-xs space-y-1">
                                        {record.memo && (
                                            <div className="text-slate-600 bg-amber-50 border border-amber-100 p-2.5 rounded-xl space-y-0.5">
                                                <div className="font-bold text-amber-800 flex items-center gap-1">
                                                    <i className="fa-solid fa-note-sticky text-amber-500"></i>
                                                    <span>수업 메모:</span>
                                                </div>
                                                <p className="text-slate-700 font-medium pl-4">{record.memo}</p>
                                            </div>
                                        )}
                                        {record.nextMemo && (
                                            <div className="text-slate-600 bg-sky-50 border border-sky-100 p-2.5 rounded-xl space-y-0.5">
                                                <div className="font-bold text-sky-800 flex items-center gap-1">
                                                    <i className="fa-solid fa-bullhorn text-sky-500"></i>
                                                    <span>다음시간 참고사항:</span>
                                                </div>
                                                <p className="text-slate-700 font-medium pl-4">{record.nextMemo}</p>
                                            </div>
                                        )}
                                        <div className="flex justify-between items-center pt-1">
                                            <button 
                                                onClick={() => setIsEditingMemo(true)} 
                                                className="text-xs font-bold text-sky-600 hover:underline inline-flex items-center gap-1 cursor-pointer"
                                            >
                                                <i className="fa-solid fa-pen"></i> {(record.memo || record.nextMemo) ? '수업 메모 수정' : '수업 메모 작성'}
                                            </button>

                                            {previousLogs.length > 0 && (
                                                <button
                                                    onClick={() => setShowHistory(!showHistory)}
                                                    className="text-xs font-bold text-slate-500 hover:text-slate-700 flex items-center gap-1 bg-slate-100 hover:bg-slate-200 px-2.5 py-1 rounded-lg transition cursor-pointer"
                                                >
                                                    <i className="fa-solid fa-clock-rotate-left text-amber-500"></i>
                                                    <span>이전 메모 이력 ({previousLogs.length}건)</span>
                                                </button>
                                            )}
                                        </div>

                                        {showHistory && previousLogs.length > 0 && (
                                            <div className="mt-2 bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-2 max-h-48 overflow-y-auto">
                                                <div className="text-xs font-bold text-slate-500 border-b pb-1 flex justify-between">
                                                    <span>📜 {cls.displayName}반 이전 차시 기록</span>
                                                    <button onClick={() => setShowHistory(false)} className="text-slate-400 hover:text-slate-600 cursor-pointer">닫기</button>
                                                </div>
                                                {previousLogs.map((log, i) => (
                                                    <div key={i} className="text-xs bg-white p-2 rounded-lg border border-slate-100 space-y-1">
                                                        <div className="flex justify-between font-bold text-slate-700">
                                                            <span>{log.lessonNumber}차시 - {log.topic}</span>
                                                            <span className="text-slate-400 font-normal">{log.date || ''}</span>
                                                        </div>
                                                        {log.memo && <p className="text-amber-800">📌 메모: {log.memo}</p>}
                                                        {log.nextMemo && <p className="text-sky-800">💡 다음참고: {log.nextMemo}</p>}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="space-y-2 bg-slate-50 p-3 rounded-xl border">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-0.5">이번 수업 기록 메모</label>
                                            <input 
                                                type="text" 
                                                placeholder="예: 공 부족으로 2인 1조 진행" 
                                                value={memo}
                                                onChange={(e) => setMemo(e.target.value)}
                                                className="w-full text-xs p-2 border rounded-lg font-medium"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-0.5">다음 시간 참고사항</label>
                                            <input 
                                                type="text" 
                                                placeholder="예: 수업 시작 전 던지기 동작 복습 필요" 
                                                value={nextMemo}
                                                onChange={(e) => setNextMemo(e.target.value)}
                                                className="w-full text-xs p-2 border rounded-lg font-medium"
                                            />
                                        </div>
                                        <div className="flex justify-end gap-2 pt-1">
                                            <button 
                                                onClick={() => setIsEditingMemo(false)} 
                                                className="px-2.5 py-1 text-xs font-bold text-slate-500 cursor-pointer"
                                            >
                                                취소
                                            </button>
                                            <button 
                                                onClick={() => {
                                                    onSaveMemo(memo, nextMemo);
                                                    setIsEditingMemo(false);
                                                }} 
                                                className="px-3.5 py-1.5 bg-sky-600 text-white rounded-lg text-xs font-bold hover:bg-sky-500 shadow-sm cursor-pointer"
                                            >
                                                저장
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="p-4 bg-slate-50 border-t border-slate-100 flex gap-3">
                        <button 
                            onClick={onOpenPresentation}
                            className="flex-1 min-h-[52px] bg-slate-800 hover:bg-slate-700 active:scale-[0.98] text-white font-bold rounded-xl text-sm flex items-center justify-center gap-2 transition shadow-sm cursor-pointer"
                        >
                            <i className="fa-solid fa-desktop text-base text-sky-400"></i>
                            <span>수업 화면 (전자칠판)</span>
                        </button>
                        
                        <button 
                            onClick={onComplete}
                            className="flex-1 min-h-[52px] bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white font-extrabold rounded-xl text-base flex items-center justify-center gap-2 transition shadow-md cursor-pointer"
                        >
                            <i className="fa-solid fa-circle-check text-lg"></i>
                            <span>수업 완료</span>
                        </button>
                    </div>
                </div>
            );
        }

        function TeamMakerView({ activeGrade, currentClasses, db, setDb, showToast }) {
            const [selectedClassId, setSelectedClassId] = React.useState(currentClasses[0]?.id || '');
            const [teamCount, setTeamCount] = React.useState(4);
            const [genderMode, setGenderMode] = React.useState('MIXED'); // 'MIXED' (남녀 혼합), 'SEPARATE'
            const [balanceSkill, setBalanceSkill] = React.useState(true);
            const [avoidConflict, setAvoidConflict] = React.useState(true);
            
            // Absent students state (excluded from team creation)
            const [absentStudentIds, setAbsentStudentIds] = React.useState([]);

            const [generatedTeams, setGeneratedTeams] = React.useState(null);
            const [showStudentModal, setShowStudentModal] = React.useState(false);

            const currentClassObj = currentClasses.find(c => c.id === selectedClassId) || currentClasses[0];
            const activeClassId = currentClassObj ? currentClassObj.id : null;

            // Reset absent students when class changes
            React.useEffect(() => {
                setAbsentStudentIds([]);
                setGeneratedTeams(null);
            }, [selectedClassId]);

            const allStudents = db.students || [];
            const classStudents = React.useMemo(() => {
                if (!activeClassId) return [];
                return allStudents
                    .filter(s => s.classId === activeClassId)
                    .sort((a, b) => a.studentNumber - b.studentNumber);
            }, [allStudents, activeClassId]);

            // Filter out absent students
            const participatingStudents = React.useMemo(() => {
                return classStudents.filter(s => !absentStudentIds.includes(s.id));
            }, [classStudents, absentStudentIds]);

            const maleCount = participatingStudents.filter(s => s.gender === 'M').length;
            const femaleCount = participatingStudents.filter(s => s.gender === 'F').length;
            const avgSkill = participatingStudents.length > 0 
                ? (participatingStudents.reduce((acc, s) => acc + (s.skillLevel || 3), 0) / participatingStudents.length).toFixed(1)
                : '0.0';

            const toggleAbsent = (studentId) => {
                setAbsentStudentIds(prev => 
                    prev.includes(studentId) ? prev.filter(id => id !== studentId) : [...prev, studentId]
                );
            };

            const handleClearAbsent = () => {
                setAbsentStudentIds([]);
                showToast('✅ 모든 학생이 출석(참여) 상태로 변경되었습니다.', 'info');
            };

            // Multi-sheet Excel Template Download
            const handleDownloadStudentTemplate = () => {
                if (typeof XLSX === 'undefined') {
                    showToast('⚠️ XLSX 라이브러리가 로드되지 않았습니다.', 'error');
                    return;
                }

                const workbook = XLSX.utils.book_new();
                const targetClasses = currentClasses.length > 0 ? currentClasses : [
                    { id: 'sample_1', classNumber: 1, displayName: '1반' },
                    { id: 'sample_2', classNumber: 2, displayName: '2반' }
                ];

                targetClasses.forEach(cls => {
                    const sheetData = [
                        ['번호', '이름', '성별(남/여)', '운동기능(1~5별점)', '기피친구번호(쉼표구분)'],
                        [1, '김민준', '남', 5, '5'],
                        [2, '이서준', '남', 4, ''],
                        [3, '박도윤', '남', 3, ''],
                        [4, '이지아', '여', 5, '8'],
                        [5, '최시우', '남', 4, '1'],
                        [6, '김서아', '여', 4, ''],
                        [7, '박하윤', '여', 3, ''],
                        [8, '최지우', '여', 4, '4']
                    ];
                    const ws = XLSX.utils.aoa_to_sheet(sheetData);
                    ws['!cols'] = [{ wch: 8 }, { wch: 14 }, { wch: 14 }, { wch: 18 }, { wch: 28 }];
                    XLSX.utils.book_append_sheet(workbook, ws, `${cls.displayName}반`);
                });

                XLSX.writeFile(workbook, `PE_Master_${activeGrade?.displayName || '체육'}_학생명단_양식(시트별).xlsx`);
                showToast('📥 학급별 시트가 포함된 학생 명단 Excel 양식이 다운로드되었습니다.', 'success');
            };

            // Multi-sheet Excel Upload
            const handleUploadStudentExcel = (file) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const importedStudents = [];

                        workbook.SheetNames.forEach(sheetName => {
                            const matchedClass = currentClasses.find(c => 
                                sheetName.includes(`${c.classNumber}반`) || 
                                sheetName.includes(c.displayName) ||
                                sheetName.trim() === `${c.classNumber}`
                            );

                            const targetClassId = matchedClass ? matchedClass.id : activeClassId;
                            const ws = workbook.Sheets[sheetName];
                            const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

                            if (rows.length > 1) {
                                const headers = rows[0].map(h => String(h || '').trim());
                                const numIdx = headers.findIndex(h => h.includes('번호') || h.includes('no'));
                                const nameIdx = headers.findIndex(h => h.includes('이름') || h.includes('성명') || h.includes('name'));
                                const genderIdx = headers.findIndex(h => h.includes('성별') || h.includes('gender'));
                                const skillIdx = headers.findIndex(h => h.includes('운동') || h.includes('기능') || h.includes('별점'));
                                const conflictIdx = headers.findIndex(h => h.includes('기피') || h.includes('사이가') || h.includes('불화'));

                                const classStList = [];
                                for (let i = 1; i < rows.length; i++) {
                                    const row = rows[i];
                                    if (!row || !row[nameIdx !== -1 ? nameIdx : 1]) continue;

                                    const sNum = parseInt(row[numIdx !== -1 ? numIdx : 0], 10) || i;
                                    const sName = String(row[nameIdx !== -1 ? nameIdx : 1] || '').trim();
                                    const sGenderRaw = String(row[genderIdx !== -1 ? genderIdx : 2] || '').trim();
                                    const sGender = (sGenderRaw.includes('여') || sGenderRaw.toUpperCase() === 'F') ? 'F' : 'M';
                                    const sSkill = Math.max(1, Math.min(5, parseInt(row[skillIdx !== -1 ? skillIdx : 3], 10) || 3));
                                    const sConflictRaw = String(row[conflictIdx !== -1 ? conflictIdx : 4] || '').trim();

                                    classStList.push({
                                        id: `st_${targetClassId}_${sNum}_${Date.now()}_${i}`,
                                        classId: targetClassId,
                                        studentNumber: sNum,
                                        name: sName,
                                        gender: sGender,
                                        skillLevel: sSkill,
                                        conflictNums: sConflictRaw.split(/[,/ ]+/).filter(Boolean),
                                        conflicts: []
                                    });
                                }

                                classStList.forEach(st => {
                                    const targetIds = [];
                                    st.conflictNums.forEach(numStr => {
                                        const found = classStList.find(other => other.studentNumber === parseInt(numStr, 10));
                                        if (found && found.id !== st.id) targetIds.push(found.id);
                                    });
                                    st.conflicts = targetIds;
                                    delete st.conflictNums;
                                    importedStudents.push(st);
                                });
                            }
                        });

                        if (importedStudents.length > 0) {
                            setDb(prev => {
                                const importedClassIds = new Set(importedStudents.map(s => s.classId));
                                const filteredStudents = (prev.students || []).filter(s => !importedClassIds.has(s.classId));
                                return {
                                    ...prev,
                                    students: [...filteredStudents, ...importedStudents]
                                };
                            });
                            showToast(`🎉 총 ${importedStudents.length}명의 학생 명단이 Excel에서 등록되었습니다!`, 'success');
                        } else {
                            showToast('⚠️ Excel에서 유효한 학생 데이터를 찾지 못했습니다.', 'error');
                        }
                    } catch(err) {
                        console.error("Excel student parse error:", err);
                        showToast('❌ Excel 파싱 중 오류가 발생했습니다.', 'error');
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            // Team Generation Logic (Using participatingStudents: Excludes Absent Students)
            const handleGenerateTeams = () => {
                if (participatingStudents.length < teamCount) {
                    showToast(`⚠️ 참여 학생 수(${participatingStudents.length}명)가 팀 수(${teamCount}개)보다 적습니다. 결석자 설정을 확인하세요.`, 'error');
                    return;
                }

                const TEAM_METAS = [
                    { name: '청팀', color: 'bg-blue-600', light: 'bg-blue-50', border: 'border-blue-300', text: 'text-blue-700', icon: 'fa-flag' },
                    { name: '백팀', color: 'bg-slate-600', light: 'bg-slate-50', border: 'border-slate-300', text: 'text-slate-700', icon: 'fa-shield' },
                    { name: '홍팀', color: 'bg-rose-600', light: 'bg-rose-50', border: 'border-rose-300', text: 'text-rose-700', icon: 'fa-fire' },
                    { name: '황팀', color: 'bg-amber-500', light: 'bg-amber-50', border: 'border-amber-300', text: 'text-amber-700', icon: 'fa-sun' },
                    { name: '녹팀', color: 'bg-emerald-600', light: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-700', icon: 'fa-leaf' },
                    { name: '자팀', color: 'bg-purple-600', light: 'bg-purple-50', border: 'border-purple-300', text: 'text-purple-700', icon: 'fa-gem' }
                ];

                const teams = Array.from({ length: teamCount }, (_, i) => ({
                    id: `team_${i+1}`,
                    name: TEAM_METAS[i]?.name || `${i+1}팀`,
                    meta: TEAM_METAS[i] || TEAM_METAS[0],
                    members: []
                }));

                const shuffle = (array) => {
                    const arr = [...array];
                    for (let i = arr.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [arr[i], arr[j]] = [arr[j], arr[i]];
                    }
                    return arr;
                };

                // Tier-randomized Jitter sorting
                const jitteredList = (list) => {
                    const shuffled = shuffle(list);
                    if (!balanceSkill) return shuffled;
                    return shuffled.sort((a, b) => {
                        const scoreA = (a.skillLevel || 3) + (Math.random() * 0.7 - 0.35);
                        const scoreB = (b.skillLevel || 3) + (Math.random() * 0.7 - 0.35);
                        return scoreB - scoreA;
                    });
                };

                // Round-Robin dynamic balancing
                const distributeBalanced = (studentList) => {
                    studentList.forEach(student => {
                        const candidateTeams = [...teams].sort((a, b) => {
                            if (a.members.length !== b.members.length) {
                                return a.members.length - b.members.length;
                            }
                            const skillSumA = a.members.reduce((sum, m) => sum + (m.skillLevel || 3), 0) + (Math.random() * 0.4);
                            const skillSumB = b.members.reduce((sum, m) => sum + (m.skillLevel || 3), 0) + (Math.random() * 0.4);
                            return skillSumA - skillSumB;
                        });

                        candidateTeams[0].members.push(student);
                    });
                };

                if (genderMode === 'MIXED') {
                    const males = jitteredList(participatingStudents.filter(s => s.gender === 'M'));
                    const females = jitteredList(participatingStudents.filter(s => s.gender === 'F'));

                    distributeBalanced(males);
                    distributeBalanced(females);
                } else {
                    const all = jitteredList(participatingStudents);
                    distributeBalanced(all);
                }

                // Conflict Resolution
                if (avoidConflict) {
                    for (let pass = 0; pass < 30; pass++) {
                        let hasConflict = false;
                        for (let t = 0; t < teams.length; t++) {
                            const team = teams[t];
                            for (let i = 0; i < team.members.length; i++) {
                                const stA = team.members[i];
                                for (let j = i + 1; j < team.members.length; j++) {
                                    const stB = team.members[j];
                                    const isConflict = (stA.conflicts && stA.conflicts.includes(stB.id)) ||
                                                       (stB.conflicts && stB.conflicts.includes(stA.id));

                                    if (isConflict) {
                                        hasConflict = true;
                                        let swapped = false;
                                        for (let otherT = 0; otherT < teams.length; otherT++) {
                                            if (otherT === t) continue;
                                            const otherTeam = teams[otherT];
                                            for (let k = 0; k < otherTeam.members.length; k++) {
                                                const candidate = otherTeam.members[k];
                                                if (genderMode !== 'MIXED' || candidate.gender === stB.gender) {
                                                    const candConflictInT = team.members.some(m => m.id !== stB.id && (
                                                        (m.conflicts && m.conflicts.includes(candidate.id)) ||
                                                        (candidate.conflicts && candidate.conflicts.includes(m.id))
                                                    ));
                                                    const bConflictInOtherT = otherTeam.members.some(m => m.id !== candidate.id && (
                                                        (m.conflicts && m.conflicts.includes(stB.id)) ||
                                                        (stB.conflicts && stB.conflicts.includes(m.id))
                                                    ));

                                                    if (!candConflictInT && !bConflictInOtherT) {
                                                        team.members[j] = candidate;
                                                        otherTeam.members[k] = stB;
                                                        swapped = true;
                                                        break;
                                                    }
                                                }
                                            }
                                            if (swapped) break;
                                        }
                                    }
                                }
                            }
                        }
                        if (!hasConflict) break;
                    }
                }

                let totalConflictsCount = 0;
                teams.forEach(t => {
                    t.members.forEach((m, idx) => {
                        for (let j = idx + 1; j < t.members.length; j++) {
                            const other = t.members[j];
                            if ((m.conflicts && m.conflicts.includes(other.id)) || (other.conflicts && other.conflicts.includes(m.id))) {
                                totalConflictsCount++;
                            }
                        }
                    });
                });

                const absentList = classStudents.filter(s => absentStudentIds.includes(s.id));

                setGeneratedTeams({
                    teams,
                    totalConflictsCount,
                    absentStudents: absentList,
                    createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                });

                if (typeof confetti === 'function') {
                    confetti({ particleCount: 70, spread: 80, origin: { y: 0.6 } });
                }
                showToast(`🎯 ${currentClassObj.displayName}반 (${participatingStudents.length}명 참여) ${teamCount}개 팀 편성이 완료되었습니다!`, 'success');
            };

            const handleUpdateSkill = (studentId, newLevel) => {
                setDb(prev => ({
                    ...prev,
                    students: (prev.students || []).map(s => 
                        s.id === studentId ? { ...s, skillLevel: newLevel } : s
                    )
                }));
            };

            const handleDeleteStudent = (studentId) => {
                setDb(prev => ({
                    ...prev,
                    students: (prev.students || []).filter(s => s.id !== studentId)
                }));
                showToast('👋 학생이 명단에서 삭제(전출)되었습니다.');
            };

            return (
                <div className="space-y-6">
                    {/* Header Controls */}
                    <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-wrap justify-between items-center gap-4">
                        <div>
                            <div className="flex items-center gap-2">
                                <span className="bg-sky-500 text-white p-2 rounded-xl text-lg font-bold">
                                    <i className="fa-solid fa-people-group"></i>
                                </span>
                                <h2 className="text-2xl font-black text-slate-900">
                                    {activeGrade?.displayName} 팀 구성 마스터
                                </h2>
                            </div>
                            <p className="text-slate-500 text-sm mt-1">
                                결석생 제외, 남녀 성비 균등 배분, 운동 기능(별점) 밸런싱, 기피 친구 분리 알고리즘이 적용됩니다.
                            </p>
                        </div>

                        <div className="flex flex-wrap items-center gap-2">
                            <label className="text-xs font-bold text-slate-500">대상 학급:</label>
                            <select 
                                value={selectedClassId} 
                                onChange={(e) => setSelectedClassId(e.target.value)}
                                className="p-2.5 border rounded-xl font-bold text-sm bg-slate-50 focus:ring-2 focus:ring-sky-500 cursor-pointer"
                            >
                                {currentClasses.map(c => (
                                    <option key={c.id} value={c.id}>{c.displayName}반</option>
                                ))}
                            </select>

                            <button 
                                onClick={() => setShowStudentModal(true)}
                                className="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2.5 rounded-xl font-bold text-xs transition flex items-center gap-2 shadow cursor-pointer"
                            >
                                <i className="fa-solid fa-user-gear text-sky-400"></i>
                                <span>학생 명부 관리 ({classStudents.length}명)</span>
                            </button>

                            <button 
                                onClick={handleDownloadStudentTemplate}
                                className="bg-amber-500 hover:bg-amber-600 text-white px-3.5 py-2.5 rounded-xl font-bold text-xs transition flex items-center gap-1.5 shadow cursor-pointer"
                                title="반별 시트로 구분된 학생 명단 Excel 양식 다운로드"
                            >
                                <i className="fa-solid fa-file-excel"></i>
                                <span>명단 양식 내려받기</span>
                            </button>

                            <label className="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2.5 rounded-xl font-bold text-xs transition flex items-center gap-1.5 shadow cursor-pointer">
                                <i className="fa-solid fa-file-arrow-up"></i>
                                <span>명단 Excel 등록</span>
                                <input 
                                    type="file" 
                                    accept=".xlsx, .xls" 
                                    className="hidden" 
                                    onChange={(e) => e.target.files[0] && handleUploadStudentExcel(e.target.files[0])}
                                />
                            </label>
                        </div>
                    </div>

                    {/* Team Configuration Setup Card */}
                    <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-6">

                                        updated = prev.students.map(s => s.id === stData.id ? stData : s);

            const [editingId, setEditingId] = React.useState(null);

            const [formNum, setFormNum] = React.useState(students.length + 1);
            const [formName, setFormName] = React.useState('');
            const [formGender, setFormGender] = React.useState('M');
            const [formSkill, setFormSkill] = React.useState(3);
            const [formConflicts, setFormConflicts] = React.useState([]);

            const handleStartEdit = (st) => {
                setEditingId(st.id);
                setFormNum(st.studentNumber);
                setFormName(st.name);
                setFormGender(st.gender);
                setFormSkill(st.skillLevel || 3);
                setFormConflicts(st.conflicts || []);
                setIsAddingNew(false);
            };

            const handleStartAdd = () => {
                const maxNum = students.reduce((max, s) => Math.max(max, s.studentNumber), 0);
                setEditingId(null);
                setFormNum(maxNum + 1);
                setFormName('');
                setFormGender('M');
                setFormSkill(3);
                setFormConflicts([]);
                setIsAddingNew(true);
            };

            const handleSave = (e) => {
                e.preventDefault();
                if (!formName.trim()) return;

                const studentData = {
                    id: editingId || `st_${classObj.id}_${Date.now()}`,
                    classId: classObj.id,
                    studentNumber: parseInt(formNum, 10) || 1,
                    name: formName.trim(),
                    gender: formGender,
                    skillLevel: formSkill,
                    conflicts: formConflicts
                };

                onSaveStudent(studentData);
                setIsAddingNew(false);
                setEditingId(null);
            };

            const toggleConflictStudent = (targetId) => {
                if (formConflicts.includes(targetId)) {
                    setFormConflicts(formConflicts.filter(id => id !== targetId));
                } else {
                    setFormConflicts([...formConflicts, targetId]);
                }
            };

                                <button
                                    onClick={handleStartAdd}
                                    className="bg-sky-600 hover:bg-sky-500 text-white font-bold px-4 py-2 rounded-xl text-xs transition flex items-center gap-1.5 shadow cursor-pointer"
                                >
                                    <i className="fa-solid fa-user-plus"></i> 학생 추가 (전입)
                                </button>
                            )}

                                        {editingId ? '학생 정보 및 기피 친구 수정' : '새로운 학생 추가 (전입생)'}

                                    <button 
                                        type="button" 
                                        onClick={() => { setIsAddingNew(false); setEditingId(null); }}

                                        취소

                                            type="text" 
                                            placeholder="학생 이름" 
                                            value={formName}
                                            onChange={(e) => setFormName(e.target.value)}

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">성별</label>
                                        <div className="flex gap-2">
                                            <button
                                                type="button"
                                                onClick={() => setFormGender('M')}
                                                className={`flex-1 py-2 rounded-xl text-xs font-bold border transition cursor-pointer ${
                                                    formGender === 'M' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200'

        function ExcelImportView({ db, setDb, selectedSchoolYearId, currentGrades, showToast, onFinish }) {
            const [step, setStep] = React.useState(1);
            const [rawHeaders, setRawHeaders] = React.useState([]);
            const [parsedData, setParsedData] = React.useState([]);
            const [selectedGradeId, setSelectedGradeId] = React.useState(currentGrades[0]?.id || '');

            const TARGET_FIELDS = [
                { key: 'lessonNumber', name: '차시 번호', required: true },
                { key: 'unit', name: '단원', required: false },
                { key: 'topic', name: '소주제 (차시명)', required: true },
                { key: 'objective', name: '차시 목표', required: false },
                { key: 'mainActivity', name: '핵심 활동', required: false },
                { key: 'gameActivity', name: '게임/표현 활동', required: false },
                { key: 'materials', name: '준비물', required: false },
                { key: 'assessment', name: '평가 포인트', required: false },
                { key: 'edutech', name: '에듀테크/AI 아이디어', required: false }
            ];

            const [columnMapping, setColumnMapping] = React.useState({});

            const handleDownloadStandardTemplate = () => {
                if (typeof XLSX === 'undefined') {
                    showToast('⚠️ XLSX 라이브러리가 로드되지 않았습니다.', 'error');
                    return;
                }

                const headers = ['차시', '단원', '소주제', '차시 목표', '핵심 활동', '게임/표현 활동', '준비물', '평가 포인트', '에듀테크/AI 아이디어'];
                const sampleRows = [
                    [1, '운동 - 건강한 생활', '바른 자세와 건강', '신체 활동에 필요한 바른 자세를 익힌다.', '1. 바른 자세 체험\n2. 스트레칭 릴레이', '바른 자세 릴레이 게임', '매트, 타이머', '바른 자세를 유지하며 참여하는가?', '스마트폰 카메라 동작 피드백'],
                    [2, '운동 - 건강한 생활', '신나게 달려요', '다양한 달리기 동작을 통해 심폐 지구력을 기른다.', '1. 조깅 및 인터벌 런\n2. 지그재그 런', '꼬리잡기 놀이', '콘, 팀 조끼', '지치지 않고 규칙에 맞게 달리는가?', '심박수 측정 스마트워치 앱'],
                    [3, '스포츠 - 조작 움직임', '공을 튀겨요', '손으로 공을 다루는 기초 조작 능력을 익힌다.', '1. 제자리 드리블 연습\n2. 이동 드리블 훈련', '드리블 신호등 게임', '농구공, 콘', '공의 바운드를 조절할 수 있는가?', '드리블 횟수 카운터 앱']
                ];

                const ws = XLSX.utils.aoa_to_sheet([headers, ...sampleRows]);
                ws['!cols'] = [
                    { wch: 8 }, { wch: 18 }, { wch: 22 }, { wch: 30 }, { wch: 30 }, { wch: 25 }, { wch: 18 }, { wch: 25 }, { wch: 25 }
                ];
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, '체육교육과정');
                XLSX.writeFile(wb, 'PE_Master_표준_교육과정_양식.xlsx');
                showToast('📥 표준 교육과정 Excel 양식이 다운로드되었습니다.', 'success');
            };

            const handleFileUpload = (file) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

                    if (json.length > 0) {
                        let bestHeaderIdx = 0;
                        let maxMatches = -1;

                        const keywords = ['차시', '단원', '주제', '목표', '활동', '게임', '준비물', '평가', '에듀테크', 'lesson', 'unit', 'topic', 'objective'];

                        json.slice(0, 10).forEach((row, idx) => {
                            if (!Array.isArray(row)) return;
                            const rowStr = row.map(c => String(c || '').toLowerCase()).join(' ');
                            let matchCount = 0;
                            keywords.forEach(kw => {
                                if (rowStr.includes(kw)) matchCount++;
                            });
                            if (matchCount > maxMatches && matchCount > 0) {
                                maxMatches = matchCount;
                                bestHeaderIdx = idx;
                            }
                        });

                        const headers = json[bestHeaderIdx].map(h => String(h || '').trim());
                        
                        const rawRows = json.slice(bestHeaderIdx + 1);
                        const rows = rawRows.filter(r => 
                            Array.isArray(r) && r.some(cell => cell !== null && cell !== undefined && String(cell).trim() !== '')
                        );

                        setRawHeaders(headers);
                        setParsedData(rows);

                        const initialMapping = {};
                        TARGET_FIELDS.forEach(field => {
                            const matched = headers.find(h => 
                                h.includes(field.name) || 
                                field.name.includes(h) ||
                                (field.key === 'lessonNumber' && (h.includes('차시') || h.toLowerCase().includes('lesson') || h.includes('번호'))) ||
                                (field.key === 'unit' && (h.includes('단원') || h.includes('영역') || h.toLowerCase().includes('unit'))) ||
                                (field.key === 'topic' && (h.includes('주제') || h.includes('소주제') || h.includes('제목') || h.toLowerCase().includes('topic'))) ||
                                (field.key === 'objective' && (h.includes('목표') || h.toLowerCase().includes('objective'))) ||
                                (field.key === 'mainActivity' && (h.includes('핵심') || h.includes('주요활동') || (h.includes('활동') && !h.includes('게임')))) ||
                                (field.key === 'gameActivity' && (h.includes('게임') || h.includes('놀이') || h.includes('표현활동'))) ||
                                (field.key === 'materials' && (h.includes('준비물') || h.includes('교구') || h.toLowerCase().includes('material')))
                            );
                            if (matched) initialMapping[field.key] = matched;
                        });

                        setColumnMapping(initialMapping);
                        setStep(2);
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            const handleSaveCurriculum = () => {
                const mappedLessons = parsedData.map((row, idx) => {
                    const getVal = (key) => {
                        const colHeader = columnMapping[key];
                        if (!colHeader) return '';
                        const colIdx = rawHeaders.indexOf(colHeader);
                        return (colIdx !== -1 && row[colIdx] !== undefined) ? String(row[colIdx]).trim() : '';
                    };

                    const rawLessonStr = getVal('lessonNumber');
                    const numMatch = rawLessonStr.replace(/[^0-9]/g, '');
                    const parsedNum = parseInt(numMatch, 10);
                    const lessonNum = (!isNaN(parsedNum) && parsedNum > 0) ? parsedNum : (idx + 1);

                    return {
                        id: `l_imp_${Date.now()}_${idx}`,
                        lessonNumber: lessonNum,
                        unit: getVal('unit') || '미지정 단원',
                        topic: getVal('topic') || `${lessonNum}차시 수업`,
                        objective: getVal('objective') || '',
                        mainActivity: getVal('mainActivity') || '',
                        gameActivity: getVal('gameActivity') || '',
                        materials: getVal('materials') || '',
                        assessment: getVal('assessment') || '',
                        edutech: getVal('edutech') || ''
                    };
                });

                const totalLessonsCount = mappedLessons.length;
                const newCurriculumId = `curr_${Date.now()}`;
                const newCurriculum = {
                    id: newCurriculumId,
                    schoolYearId: selectedSchoolYearId,
                    gradeId: selectedGradeId,
                    semester: '2학기',
                    subject: '체육',
                    title: `가져온 교육과정 (${totalLessonsCount}차시)`,
                    totalLessons: totalLessonsCount,
                    lessons: mappedLessons
                };

                const updatedGrades = (db.grades || []).map(g => 
                    g.id === selectedGradeId ? { ...g, curriculumId: newCurriculumId } : g
                );

                setDb(prev => ({
                    ...prev,
                    curriculums: [...(prev.curriculums || []), newCurriculum],
                    grades: updatedGrades
                }));

                showToast(`🎉 총 ${totalLessonsCount}차시의 교육과정을 성공적으로 등록하고 연결했습니다!`, 'success');
                onFinish();
            };

            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-wrap justify-between items-center gap-3">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-900">교육과정 Excel 가져오기</h2>
                            <p className="text-slate-500 text-sm mt-1">
                                보유하신 체육 교육과정 Excel/CSV 파일을 업로드하여 자동으로 매핑합니다.
                            </p>
                        </div>
                        <button
                            onClick={handleDownloadStandardTemplate}
                            className="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2.5 rounded-xl font-bold text-xs transition flex items-center gap-2 shadow cursor-pointer"

            const [isLoading, setIsLoading] = React.useState(false);

            const activeClass = currentClasses.find(c => c.id === selectedClassId) || currentClasses[0];

            const handleAskAi = async (customQuestion) => {
                const question = customQuestion || promptQuery;
                if (!question.trim()) return;

                setIsLoading(true);
                setAiResponse('');

                const systemInstruction = `당신은 대한민국 초등학교 베테랑 체육 전담교사이자 AI 교수학습 컨설턴트입니다.
현재 차시 정보와 학급 상황을 바탕으로 실질적이고 현장감 있는 체육 수업 팁을 제공해 주세요.`;

                const userPrompt = `[수업 맥락 정보]
- 학급: ${activeClass?.displayName || '학급'}
- 현재 차시: ${currentLessonNum}차시
- 단원: ${currentLesson?.unit || '-'}
- 소주제: ${currentLesson?.topic || '-'}

[선생님의 질문]
"${question}"

위 상황을 반영하여 구체적이고 바로 적용 가능한 아이디어나 조언을 불릿 포인트로 답변해 주세요.`;

                try {
                    const apiKey = ""; 
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    const payload = {
                        contents: [{ parts: [{ text: userPrompt }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] }
                    };

                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },

                        >
                            {currentClasses.map(c => (
                                <option key={c.id} value={c.id}>{c.displayName}반 ({((db.classProgressCursors && db.classProgressCursors[c.id]) || 1)}차시 진행 예정)</option>
                            ))}
                        </select>
                    </div>

                    <div className="flex flex-wrap gap-2">
                        {[

        function SettingsManagerView({ db, setDb, selectedSchoolYearId, showToast }) {
            const [newYearName, setNewYearName] = React.useState('');
            const [newGradeNum, setNewGradeNum] = React.useState(4);
            const [showResetConfirm, setShowResetConfirm] = React.useState(false);
            const [resetMode, setResetMode] = React.useState('YEAR');

            const currentYearObj = (db.schoolYears || []).find(sy => sy.id === selectedSchoolYearId) || { year: '현재 학년도' };
            const yearGrades = (db.grades || []).filter(g => g.schoolYearId === selectedSchoolYearId);

            const handleAddYear = (e) => {
                e.preventDefault();
                if (!newYearName.trim()) return;
                const newSy = { id: `sy_${Date.now()}`, year: newYearName.trim(), isCurrent: false };
                setDb(prev => ({ ...prev, schoolYears: [...(prev.schoolYears || []), newSy] }));
                setNewYearName('');
                showToast(`📅 ${newYearName.trim()} 학년도가 추가되었습니다.`);
            };

            const handleAddGrade = () => {
                const existingGrade = (db.grades || []).find(g => g.schoolYearId === selectedSchoolYearId && g.gradeNumber === newGradeNum);
                if (existingGrade) {
                    showToast(`⚠️ 이미 ${newGradeNum}학년이 등록되어 있습니다.`, 'info');
                    return;
                }

                const gradeId = `g_${Date.now()}`;
                const newGrade = {
                    id: gradeId,
                    schoolYearId: selectedSchoolYearId,
                    gradeNumber: newGradeNum,
                    displayName: `${newGradeNum}학년`,
                    active: true,
                    curriculumId: null
                };

                const newClasses = Array.from({ length: 5 }, (_, i) => ({
                    id: `c_${gradeId}_${i+1}`,
                    gradeId: gradeId,
                    classNumber: i + 1,
                    displayName: `${newGradeNum}-${i+1}`,
                    active: true
                }));

                setDb(prev => ({
                    ...prev,
                    grades: [...(prev.grades || []), newGrade],
                    classes: [...(prev.classes || []), ...newClasses]
                }));
                showToast(`🎓 ${newGradeNum}학년 (1~5반)이 성공적으로 추가되었습니다.`, 'success');
            };

            const handleDeleteGrade = (gradeId) => {
                const targetGrade = (db.grades || []).find(g => g.id === gradeId);
                if (!targetGrade) return;

                setDb(prev => {
                    const filteredGrades = (prev.grades || []).filter(g => g.id !== gradeId);
                    const classIdsToRemove = new Set((prev.classes || []).filter(c => c.gradeId === gradeId).map(c => c.id));
                    const filteredClasses = (prev.classes || []).filter(c => c.gradeId !== gradeId);

                    const updatedRecords = { ...prev.lessonRecords };
                    Object.keys(updatedRecords).forEach(key => {
                        const classId = key.substring(0, key.lastIndexOf('_'));
                        if (classIdsToRemove.has(classId)) {
                            delete updatedRecords[key];
                        }
                    });

                    const updatedCursors = { ...prev.classProgressCursors };
                    classIdsToRemove.forEach(cId => {
                        delete updatedCursors[cId];
                    });

                    return {
                        ...prev,
                        grades: filteredGrades,
                        classes: filteredClasses,
                        lessonRecords: updatedRecords,
                        classProgressCursors: updatedCursors
                    };
                });

                showToast(`🗑️ ${targetGrade.displayName}이(가) 삭제되었습니다.`);
            };

            const handleAddClassToGrade = (gradeObj) => {
                const existingClasses = (db.classes || []).filter(c => c.gradeId === gradeObj.id);
                const nextNum = existingClasses.length + 1;
                const newClass = {
                    id: `c_${gradeObj.id}_${Date.now()}`,
                    gradeId: gradeObj.id,
                    classNumber: nextNum,
                    displayName: `${gradeObj.gradeNumber}-${nextNum}`,
                    active: true
                };

                setDb(prev => ({
                    ...prev,
                    classes: [...(prev.classes || []), newClass]
                }));
                showToast(`➕ ${gradeObj.displayName}에 ${gradeObj.gradeNumber}-${nextNum}반이 추가되었습니다.`);
            };

            const handleRemoveClassFromGrade = (gradeObj) => {
                const existingClasses = (db.classes || []).filter(c => c.gradeId === gradeObj.id);
                if (existingClasses.length <= 1) {
                    showToast('⚠️ 최소 1개 이상의 학급이 필요합니다.', 'info');
                    return;
                }
                const classToRemove = existingClasses[existingClasses.length - 1];

                setDb(prev => {
                    const filteredClasses = (prev.classes || []).filter(c => c.id !== classToRemove.id);
                    const updatedRecords = { ...prev.lessonRecords };
                    Object.keys(updatedRecords).forEach(key => {
                        if (key.startsWith(`${classToRemove.id}_`)) {
                            delete updatedRecords[key];
                        }
                    });

                    const updatedCursors = { ...prev.classProgressCursors };
                    delete updatedCursors[classToRemove.id];

                    return {
                        ...prev,
                        classes: filteredClasses,
                        lessonRecords: updatedRecords,
                        classProgressCursors: updatedCursors
                    };
                });
                showToast(`➖ ${classToRemove.displayName}반이 삭제되었습니다.`);
            };

            const handleConfirmReset = () => {
                if (resetMode === 'YEAR') {
                    setDb(prev => {
                        const yearGradeIds = new Set((prev.grades || []).filter(g => g.schoolYearId === selectedSchoolYearId).map(g => g.id));
                        const yearClassIds = new Set((prev.classes || []).filter(c => yearGradeIds.has(c.gradeId)).map(c => c.id));

                        const updatedRecords = { ...prev.lessonRecords };
                        Object.keys(updatedRecords).forEach(key => {
                            const classId = key.substring(0, key.lastIndexOf('_'));
                            if (yearClassIds.has(classId)) {
                                delete updatedRecords[key];
                            }
                        });

                        const updatedCursors = { ...prev.classProgressCursors };
                        yearClassIds.forEach(cId => {
                            delete updatedCursors[cId];
                        });

                        return {
                            ...prev,
                            grades: (prev.grades || []).filter(g => g.schoolYearId !== selectedSchoolYearId),
                            classes: (prev.classes || []).filter(c => !yearGradeIds.has(c.gradeId)),
                            curriculums: (prev.curriculums || []).filter(c => c.schoolYearId !== selectedSchoolYearId),
                            lessonRecords: updatedRecords,
                            classProgressCursors: updatedCursors
                        };
                    });
                    showToast(`🔄 [${currentYearObj.year}] 데이터만 선택적으로 초기화되었습니다.`, 'success');
                } else {
                    localStorage.removeItem('PE_MASTER_DB_V3');
                    setDb(INITIAL_SEED);
                    showToast('🔄 모든 데이터가 초기 샘플 상태로 전체 리셋되었습니다.', 'success');
                }
                setShowResetConfirm(false);
            };

            const handleExportData = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `PE_Master_Backup_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                        <h2 className="text-2xl font-bold text-slate-900">시스템 및 학년/학급 관리</h2>
                        <p className="text-slate-500 text-sm mt-1">
                            학년도 및 담당 학년을 구성하고 데이터를 안전하게 개별 관리/백업합니다.
                        </p>
                    </div>

                    <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
                        <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i className="fa-regular fa-calendar-plus text-sky-600"></i> 학년도 추가
                        </h3>
                        <form onSubmit={handleAddYear} className="flex gap-2">
                            <input 
                                type="text" 
                                placeholder="예: 2028학년도" 
                                value={newYearName}
                                onChange={(e) => setNewYearName(e.target.value)}
                                className="p-2.5 border rounded-xl flex-1 text-sm font-medium focus:ring-2 focus:ring-sky-500"
                            />
                            <button type="submit" className="bg-slate-800 hover:bg-slate-700 text-white font-bold px-5 py-2.5 rounded-xl text-sm transition shadow cursor-pointer">
                                학년도 추가
                            </button>
                        </form>
                    </div>

                    <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-6">
                        <div className="flex flex-wrap justify-between items-center gap-3 border-b pb-4">
                            <div>
                                <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                    <i className="fa-solid fa-users-gear text-sky-600"></i> [{currentYearObj.year}] 담당 학년 및 학급 구성
                                </h3>
                                <p className="text-xs text-slate-500 mt-0.5">선택된 학년도에 속하는 학년을 등록하거나 삭제/수정할 수 있습니다.</p>
                            </div>

                            <div className="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
                                <select 
                                    value={newGradeNum} 
                                    onChange={(e) => setNewGradeNum(parseInt(e.target.value, 10))}
                                    className="p-2 border rounded-xl text-sm font-bold bg-white cursor-pointer"
                                >
                                    {[1, 2, 3, 4, 5, 6].map(n => <option key={n} value={n}>{n}학년</option>)}
                                </select>
                                <button 
                                    onClick={handleAddGrade} 
                                    className="bg-sky-600 hover:bg-sky-500 text-white font-bold px-4 py-2 rounded-xl text-xs transition cursor-pointer shadow-sm flex items-center gap-1"
                                >
                                    <i className="fa-solid fa-plus"></i> 학년 추가
                                </button>
                            </div>
                        </div>

                        {yearGrades.length === 0 ? (
                            <div className="text-center py-8 text-slate-400 text-sm bg-slate-50 rounded-xl border border-dashed">
                                등록된 학년이 없습니다. 위에서 학년을 선택하고 [학년 추가]를 누르세요.
                            </div>
                        ) : (
                            <div className="space-y-4">
                                {yearGrades.map(g => {
                                    const classesInGrade = (db.classes || []).filter(c => c.gradeId === g.id);

                                    return (
                                        <div key={g.id} className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-wrap justify-between items-center gap-4">
                                            <div className="space-y-1">
                                                <div className="flex items-center gap-2">
                                                    <span className="font-extrabold text-base text-slate-900 bg-white px-3 py-1 rounded-lg border border-slate-200 shadow-sm">
                                                        {g.displayName}
                                                    </span>
                                                    <span className="text-xs font-bold text-sky-600">
                                                        총 {classesInGrade.length}개 학급 ({classesInGrade.map(c => `${c.classNumber}반`).join(', ')})
                                                    </span>
                                                </div>
                                            </div>

                                            <div className="flex items-center gap-2">
                                                <div className="flex items-center gap-1 bg-white border border-slate-200 rounded-lg p-1">
                                                    <button 
                                                        onClick={() => handleRemoveClassFromGrade(g)}
                                                        className="px-2 py-0.5 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded cursor-pointer"
                                                        title="반 1개 제거"
                                                    >
                                                        - 반 삭제
                                                    </button>
                                                    <span className="text-xs font-bold text-slate-400">|</span>
                                                    <button 
                                                        onClick={() => handleAddClassToGrade(g)}
                                                        className="px-2 py-0.5 text-xs font-bold text-sky-600 hover:bg-sky-50 rounded cursor-pointer"
                                                        title="반 1개 추가"
                                                    >
                                                        + 반 추가
                                                    </button>
                                                </div>

                                                <button 
                                                    onClick={() => handleDeleteGrade(g.id)}
                                                    className="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold rounded-lg border border-rose-200 transition flex items-center gap-1 cursor-pointer"
                                                    title={`${g.displayName} 및 하위 학급 정보 삭제`}
                                                >
                                                    <i className="fa-solid fa-trash-can"></i> 학년 삭제
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
                        <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i className="fa-solid fa-database text-sky-600"></i> 데이터 백업 및 선택적 초기화
                        </h3>
                        <p className="text-xs text-slate-500">
                            특정 학년도의 데이터를 초기화하더라도 다른 학년도의 백업 기록은 안전하게 분리·보존됩니다.
                        </p>
                        <div className="flex flex-wrap gap-3 pt-2">
                            <button onClick={handleExportData} className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-2.5 rounded-xl text-sm flex items-center gap-2 transition shadow cursor-pointer">
                                <i className="fa-solid fa-download"></i> 데이터 JSON 백업 다운로드
                            </button>
                            <button 
                                onClick={() => {
                                    setResetMode('YEAR');
                                    setShowResetConfirm(true);
                                }} 
                                className="bg-rose-600 hover:bg-rose-500 text-white font-bold px-5 py-2.5 rounded-xl text-sm flex items-center gap-2 transition shadow cursor-pointer"
                            >
                                <i className="fa-solid fa-rotate-left"></i> 데이터 초기화 설정...
                            </button>
                        </div>

                        {showResetConfirm && (
                            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                                <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-5 border border-slate-200">
                                    <div className="flex items-center gap-3 text-rose-600 border-b pb-3">
                                        <i className="fa-solid fa-triangle-exclamation text-3xl"></i>
                                        <h3 className="text-xl font-bold text-slate-900">데이터 초기화 방식 선택</h3>
                                    </div>

                                    <div className="space-y-3">
                                        <label 
                                            onClick={() => setResetMode('YEAR')}
                                            className={`p-4 rounded-xl border-2 flex items-start gap-3 cursor-pointer transition ${
                                                resetMode === 'YEAR' ? 'border-sky-500 bg-sky-50/50' : 'border-slate-200 hover:bg-slate-50'
                                            }`}
                                        >
                                            <input 
                                                type="radio" 
                                                name="resetType" 
                                                checked={resetMode === 'YEAR'} 
                                                onChange={() => setResetMode('YEAR')}
                                                className="mt-1"
                                            />
                                            <div>
                                                <strong className="block text-slate-900 text-sm">
                                                    [{currentYearObj.year}] 데이터만 초기화 (권장)
                                                </strong>
                                                <span className="text-xs text-slate-500 mt-0.5 block leading-relaxed">
                                                    현재 선택된 <strong>{currentYearObj.year}</strong>의 학급 진도, 차시 메모, 연결된 교육과정만 초기화하며, <u>타 학년도 데이터는 안전하게 보존</u>됩니다.
                                                </span>
                                            </div>
                                        </label>

                                        <label 
                                            onClick={() => setResetMode('ALL')}
                                            className={`p-4 rounded-xl border-2 flex items-start gap-3 cursor-pointer transition ${
                                                resetMode === 'ALL' ? 'border-rose-500 bg-rose-50/50' : 'border-slate-200 hover:bg-slate-50'
                                            }`}
                                        >
                                            <input 
                                                type="radio" 
                                                name="resetType" 
                                                checked={resetMode === 'ALL'} 
                                                onChange={() => setResetMode('ALL')}
                                                className="mt-1"
                                            />
                                            <div>
                                                <strong className="block text-rose-700 text-sm">
                                                    전체 시스템 공장 초기화
                                                </strong>
                                                <span className="text-xs text-slate-500 mt-0.5 block leading-relaxed">
                                                    모든 학년도의 전체 기록과 설정 데이터를 완전히 삭제하고 처음 샘플 상태로 되돌립니다.
                                                </span>
                                            </div>
                                        </label>
                                    </div>

                                    <div className="pt-2 flex justify-end gap-3 border-t">
                                        <button 
                                            onClick={() => setShowResetConfirm(false)}
                                            className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-sm transition cursor-pointer"
                                        >
                                            취소
                                        </button>
                                        <button 
                                            onClick={handleConfirmReset}
                                            className={`px-5 py-2.5 text-white rounded-xl font-bold text-sm transition shadow-md cursor-pointer ${
                                                resetMode === 'YEAR' ? 'bg-sky-600 hover:bg-sky-500' : 'bg-rose-600 hover:bg-rose-500'
                                            }`}
                                        >
                                            {resetMode === 'YEAR' ? `[${currentYearObj.year}] 데이터만 초기화` : '전체 데이터 초기화 실행'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
